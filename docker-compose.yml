services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: hld-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - INFO=1
      - POST=1
      - STATS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - npm_network

  dashboard:
    image: ghcr.io/alkiory/homelab-dashboard:latest
    container_name: home-lab-dashboard
    restart: unless-stopped
    read_only: false
    # 1. EVITA EL ERROR DE APPARArmor/READ-ONLY AL TRABAJAR INTERNAMENTE:
    security_opt:
      - apparmor:unconfined
    environment:
      - PORT=3001
      - POLLING_INTERVAL=15s
      - COMPOSE_SCAN_PATH=/srv
      # 2. CORRECCIÓN CRÍTICA: Cambiar tcp://docker-proxy por tcp://hld-docker-proxy
      - DOCKER_HOST=tcp://hld-docker-proxy:2375
    volumes:
      - /proc:/proc:ro
      - /sys:/sys:ro
      - /srv:/srv:ro
      - dashboard-data:/data
    networks:
      - npm_network
    # 3. ACTUALIZA EL HEALTHCHECK AL PUERTO REAL (3001)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  dashboard-data:

networks:
  npm_network:
    name: npm_network
    external: true