services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: hld-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - INFO=1
      - POST=1
      - STATS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - npm_network

  dashboard:
    image: ghcr.io/alkiory/homelab-dashboard:latest
    container_name: home-lab-dashboard
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    environment:
      - PORT=3001                 # <-- Le dice al binario de Go que escuche en el 3001
      - POLLING_INTERVAL=15s
      - COMPOSE_SCAN_PATH=/srv
      - DOCKER_HOST=tcp://hld-docker-proxy:2375
    volumes:
      - /proc:/proc:ro
      - /sys:/sys:ro
      - /srv:/srv:ro
      - dashboard-data:/data
    networks:
      - npm_network
    healthcheck:
      # Usamos el puerto 3001 de manera dinámica para la comprobación de salud
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  dashboard-data:

networks:
  npm_network:
    name: npm_network
    external: true