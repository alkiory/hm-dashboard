services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: hld-docker-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - INFO=1
      - POST=1
      - STATS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - npm_network

  dashboard:
    build: .                     # <-- CRÍTICO: Cambiado 'image: ghcr.io...' por 'build: .'
    container_name: home-lab-dashboard
    restart: unless-stopped
    security_opt:
      - apparmor:unconfined
    environment:
      - PORT=3001                 # <-- Dejamos el 3001 interno (no colisiona porque no se publica en el host)
      - POLLING_INTERVAL=30s      # <-- 30 segundos relaja la carga y elimina el 'context deadline exceeded'
      - COMPOSE_SCAN_PATH=/srv
      - DOCKER_HOST=tcp://hld-docker-proxy:2375
    volumes:
      - /proc:/proc:ro
      - /sys:/sys:ro
      - /srv:/srv:ro
      - dashboard-data:/data
    networks:
      - npm_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"] # <-- Apunta al 3001 interno
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  dashboard-data:

networks:
  npm_network:
    name: npm_network
    external: true